<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="container-fluid text-center">
      <div class="row">
        <div class="col-6">
          <form id="init">
            <h2>Formulario de inicio de sesión</h2>
            <div class="mb-3">
              <label for="usuario" class="col-form-label">Usuario:</label>
              <input
                type="text"
                class="form-control"
                id="usuario"
                value="usuario"
                required
              />
            </div>
            <div class="mb-3">
              <label for="pass" class="col-form-label">Password:</label>
              <input
                type="password"
                class="form-control"
                id="pass"
                value="pass"
                required
              />
            </div>
            <button type="submit" class="btn btn-primary" id="submit1">
              Iniciar sesión
            </button>
            <button type="button" class="btn btn-link" id="btn">
              ¿No estás registrado? ¡Es gratis!
            </button>
          </form>
        </div>
      </div>
    </div>
    <script src="./renderer.js"></script>
     <script>
      //Validación de inicio de sesión
      const form1 = document.getElementById("init");
      form1.addEventListener("submit", (event) => {
        event.preventDefault();
        if (!form1.checkValidity()) {
          event.stopPropagation();
          console.log("Formulario Invàlido: No enviado");
        } else {
          console.log("Formulario enviado");
        }
        form1.classList.add("was-validated");
      });
    </script>
  </body>
</html>
