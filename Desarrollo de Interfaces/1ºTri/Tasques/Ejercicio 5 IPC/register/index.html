<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ejercicio 2</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="container-fluid text-center">
      <div class="row">
        <div class="col-6">
          <form id="register">
            <h2>Formulario de registro</h2>
            <div class="mb-3">
              <label for="usuario" class="col-form-label">Usuario:</label>
              <input
                type="text"
                class="form-control"
                id="user"
                value="user"
                required
              />
            </div>
            <div class="mb-3">
              <label for="mail" class="col-form-label">Email:</label>
              <input
                type="email"
                class="form-control"
                id="mail1"
                value="mail@mail.com"
                required
              />
            </div>
            <div class="mb-3">
              <label for="mail2" class="col-form-label">Repetir email:</label>
              <input
                type="email"
                class="form-control"
                id="mail2"
                value=""
                required
              />
            </div>
            <div class="mb-3">
              <label for="pass2" class="col-form-label">Password:</label>
              <input
                type="password"
                class="form-control"
                id="pass2"
                value=""
                required
              />
              <div class="form-check form-switch">
                <input
                  class="form-check-input"
                  type="checkbox"
                  role="switch"
                  id="showPass"
                  name="showPass"
                  value="false"
                />
                <label
                  class="form-check-label d-flex align-self-start"
                  for="showPass"
                >
                  Mostrar contraseña
                </label>
              </div>
            </div>
            <div class="mb-3">
              <div class="form-check">
                <input
                  class="form-check-input"
                  type="checkbox"
                  id="opcion1"
                  name="opcion1"
                  value="op1"
                  required
                />
                <label
                  class="form-check-label d-flex align-self-start"
                  for="opcion1"
                >
                  Acepto los término y condiciones
                </label>
              </div>
            </div>
            <button type="submit" class="btn btn-danger" id="submit2">
              Registrarse
            </button>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
